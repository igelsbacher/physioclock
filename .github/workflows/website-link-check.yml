name: Website link check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all internal website links and anchors
        run: node scripts/check-website-links.mjs
      - name: Verify current PhysioClock release 3.32.12 Build 93
        run: node scripts/check-current-version.mjs
